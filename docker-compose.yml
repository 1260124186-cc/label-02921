version: '3.8'

services:
  backend:
    build: ./backend
    container_name: handwriting-backend
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-admin:
    build: ./frontend-admin
    container_name: handwriting-frontend-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
